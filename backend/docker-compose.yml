version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: landlease-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: landlease_db
      MYSQL_USER: landlease
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - landlease-network

  backend:
    build: .
    container_name: landlease-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: landlease_db
      DB_USERNAME: landlease
      DB_PASSWORD: password
      JWT_SECRET: mySecretKey123456789012345678901234567890
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - landlease-network

volumes:
  mysql_data:

networks:
  landlease-network:
    driver: bridge